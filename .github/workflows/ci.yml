name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: false

    - name: Init module and get dependencies
      run: |
        go mod init dummy-server 2>/dev/null ||
        go get github.com/go-chi/chi/v5
        go mod tidy

    - name: Build
      run: |
        go build -o dummy-server.bin main.go

    - name: Test server
      run: |
        ./dummy-server.bin &
        sleep 3
        curl -f http://localhost:8888
        kill $!

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dummy-server-bin
        path: dummy-server.bin
